<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;

background:linear-gradient(-45deg,#020617,#0f172a,#1e3a8a,#2563eb,#38bdf8);
background-size:400% 400%;
animation:bg 12s ease infinite;

transition:.8s;

}

@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

.circle{

position:absolute;

border-radius:50%;

background:rgba(255,255,255,.08);

animation:float 10s ease-in-out infinite;

}

.circle:nth-child(1){

width:180px;
height:180px;
left:5%;
top:10%;

}

.circle:nth-child(2){

width:250px;
height:250px;
right:8%;
bottom:8%;

animation-duration:14s;

}

.circle:nth-child(3){

width:120px;
height:120px;
left:25%;
bottom:15%;

}

@keyframes float{

50%{

transform:translateY(-35px);

}

}

.card{

position:relative;

padding:70px 80px;

text-align:center;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(20px);

border-radius:25px;

box-shadow:0 20px 40px rgba(0,0,0,.35);

animation:show 1s ease;

overflow:hidden;

}

.card::before{

content:"";

position:absolute;

width:250%;

height:250%;

background:linear-gradient(
45deg,
transparent,
rgba(255,255,255,.12),
transparent);

top:-80%;

left:-80%;

animation:shine 8s linear infinite;

}

@keyframes shine{

100%{

transform:translateX(100%) rotate(45deg);

}

}

@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

h1{

font-size:60px;

font-weight:800;

color:white;

margin-bottom:50px;

}

h1 span{

color:#38bdf8;

}

.btn{

display:inline-block;

padding:18px 45px;

border-radius:50px;

text-decoration:none;

font-size:18px;

font-weight:600;

background:#38bdf8;

color:#081221;

transition:.4s;

}

.btn:hover{

transform:translateY(-8px);

box-shadow:0 15px 35px rgba(56,189,248,.45);

}

@media(max-width:768px){

.card{

padding:40px;

width:90%;

}

h1{

font-size:38px;

}

}

</style>

</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="card">

<h1>
Welcome to <span>My Portfolio</span>
</h1>

<a href="index.html" class="btn" id="enterBtn">
Enter My Journey →
</a>

</div>

<script>

document.getElementById("enterBtn").addEventListener("click",function(e){

e.preventDefault();

document.body.style.opacity="0";

document.body.style.transform="scale(1.05)";

setTimeout(()=>{

window.location.href="index.html";

},700);

});

</script>

</body>
</html>
