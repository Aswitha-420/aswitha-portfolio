<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(-45deg, #020617, #0f172a, #1e3a8a, #2563eb, #38bdf8);
            background-size: 400% 400%;
            animation: bg 12s ease infinite;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        @keyframes bg {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            animation: float 10s ease-in-out infinite;
        }

        .circle:nth-child(1) {
            width: 180px;
            height: 180px;
            left: 5%;
            top: 10%;
        }

        .circle:nth-child(2) {
            width: 250px;
            height: 250px;
            right: 8%;
            bottom: 8%;
            animation-duration: 14s;
        }

        .circle:nth-child(3) {
            width: 120px;
            height: 120px;
            left: 25%;
            bottom: 15%;
        }

        @keyframes float {
            50% {
                transform: translateY(-35px);
            }
        }

        /* ================= HAMBURGER MENU BUTTON ================= */
        .menu-toggle {
            position: fixed;
            top: 28px;
            left: 28px;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            z-index: 1100;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #38bdf8;
            transform: scale(1.06);
            box-shadow: 0 10px 28px rgba(56, 189, 248, 0.3);
        }

        .menu-toggle .bar {
            width: 22px;
            height: 2.5px;
            background: #ffffff;
            border-radius: 4px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
        }

        .menu-toggle .bar:nth-child(2) {
            width: 15px;
            align-self: flex-start;
            margin-left: 13px;
            background: #38bdf8;
        }

        /* Hamburger Active / Morph to X */
        .menu-toggle.active {
            background: rgba(8, 18, 33, 0.92);
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .menu-toggle.active .bar:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
            background: #38bdf8;
        }

        .menu-toggle.active .bar:nth-child(2) {
            opacity: 0;
            transform: translateX(-12px);
        }

        .menu-toggle.active .bar:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
            background: #38bdf8;
        }

        /* ================= SIDE NAVIGATION DRAWER ================= */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            z-index: 1000;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            max-width: 85vw;
            height: 100vh;
            background: rgba(8, 18, 33, 0.94);
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 95px 28px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1050;
            transform: translateX(-100%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 15px 0 45px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }

        .side-menu.open {
            transform: translateX(0);
        }

        .side-menu-header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .side-menu-header h3 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .side-menu-header h3 span {
            color: #38bdf8;
        }

        .side-menu-header p {
            color: #8195aa;
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .menu-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-nav li {
            transform: translateX(-20px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        .side-menu.open .menu-nav li:nth-child(1) { transition-delay: 0.10s; transform: translateX(0); opacity: 1; }
        .side-menu.open .menu-nav li:nth-child(2) { transition-delay: 0.15s; transform: translateX(0); opacity: 1; }
        .side-menu.open .menu-nav li:nth-child(3) { transition-delay: 0.20s; transform: translateX(0); opacity: 1; }
        .side-menu.open .menu-nav li:nth-child(4) { transition-delay: 0.25s; transform: translateX(0); opacity: 1; }
        .side-menu.open .menu-nav li:nth-child(5) { transition-delay: 0.30s; transform: translateX(0); opacity: 1; }
        .side-menu.open .menu-nav li:nth-child(6) { transition-delay: 0.35s; transform: translateX(0); opacity: 1; }

        .menu-nav a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            background: transparent;
        }

        .menu-nav a i {
            font-size: 16px;
            width: 20px;
            color: #38bdf8;
            transition: transform 0.3s ease;
        }

        .menu-nav a:hover {
            color: #ffffff;
            background: rgba(56, 189, 248, 0.1);
            transform: translateX(6px);
            border-left: 3px solid #38bdf8;
        }

        .menu-nav a:hover i {
            transform: scale(1.15);
        }

        .side-menu-footer {
            margin-top: auto;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .side-menu-socials {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .side-menu-socials a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .side-menu-socials a:hover {
            background: #38bdf8;
            color: #081221;
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .side-menu-footer p {
            color: #64748b;
            font-size: 12px;
        }

        /* ================= CARD ================= */
        .card {
            position: relative;
            padding: 70px 80px;
            text-align: center;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .35);
            animation: show 1s ease;
            overflow: hidden;
            z-index: 1;
        }

        .card::before {
            content: "";
            position: absolute;
            width: 250%;
            height: 250%;
            background: linear-gradient(45deg,
                    transparent,
                    rgba(255, 255, 255, .12),
                    transparent);
            top: -80%;
            left: -80%;
            animation: shine 8s linear infinite;
        }

        @keyframes shine {
            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        @keyframes show {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 60px;
            font-weight: 800;
            color: white;
            margin-bottom: 50px;
        }

        h1 span {
            color: #38bdf8;
        }

        .btn {
            display: inline-block;
            padding: 18px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            background: #38bdf8;
            color: #081221;
            transition: .4s;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(56, 189, 248, .45);
        }

        @media(max-width:768px) {
            .card {
                padding: 40px 25px;
                width: 90%;
            }

            h1 {
                font-size: 38px;
                margin-bottom: 35px;
            }

            .btn {
                padding: 15px 35px;
                font-size: 16px;
            }

            .menu-toggle {
                top: 18px;
                left: 18px;
                width: 44px;
                height: 44px;
            }
        }
    </style>

</head>

<body>

    <!-- Hamburger Button (Top Left) -->
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false" title="Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>

    <!-- Overlay Backdrop -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Side Navigation Menu -->
    <aside class="side-menu" id="sideMenu" aria-label="Side navigation">
        <div>
            <div class="side-menu-header">
                <h3>Aswitha <span>A</span></h3>
                <p>Cloud & DevOps Engineer</p>
            </div>

            <ul class="menu-nav">
                <li>
                    <a href="portfolio.html#home" class="nav-link">
                        <i class="fas fa-house"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="portfolio.html#about" class="nav-link">
                        <i class="fas fa-user"></i>
                        <span>About Me</span>
                    </a>
                </li>
                <li>
                    <a href="portfolio.html#skills" class="nav-link">
                        <i class="fas fa-code"></i>
                        <span>Skills & Tech</span>
                    </a>
                </li>
                <li>
                    <a href="portfolio.html#internship" class="nav-link">
                        <i class="fas fa-briefcase"></i>
                        <span>Internship & Exp</span>
                    </a>
                </li>
                <li>
                    <a href="portfolio.html#projects" class="nav-link">
                        <i class="fas fa-layer-group"></i>
                        <span>Projects</span>
                    </a>
                </li>
                <li>
                    <a href="portfolio.html#contact" class="nav-link">
                        <i class="fas fa-envelope"></i>
                        <span>Contact</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="side-menu-footer">
            <div class="side-menu-socials">
                <a href="https://www.linkedin.com/in/aswitha-a-7241a033b" target="_blank" title="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <a href="https://github.com/Aswitha-420" target="_blank" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="mailto:aswithaaruchamy04@gmail.com" title="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
            <p>&copy; 2026 Aswitha A.</p>
        </div>
    </aside>

    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="card">
        <h1>
            Welcome to <span>My Portfolio</span>
        </h1>

        <a href="portfolio.html" class="btn" id="enterBtn">
            Enter My Journey →
        </a>
    </div>

    <script>
        // Hamburger Menu Interaction
        const menuToggle = document.getElementById("menuToggle");
        const sideMenu = document.getElementById("sideMenu");
        const menuOverlay = document.getElementById("menuOverlay");

        function toggleMenu() {
            const isOpen = menuToggle.classList.toggle("active");
            sideMenu.classList.toggle("open", isOpen);
            menuOverlay.classList.toggle("active", isOpen);
            menuToggle.setAttribute("aria-expanded", isOpen);
        }

        function closeMenu() {
            menuToggle.classList.remove("active");
            sideMenu.classList.remove("open");
            menuOverlay.classList.remove("active");
            menuToggle.setAttribute("aria-expanded", "false");
        }

        menuToggle.addEventListener("click", toggleMenu);
        menuOverlay.addEventListener("click", closeMenu);

        // Close on Escape key
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && sideMenu.classList.contains("open")) {
                closeMenu();
            }
        });

        // Smooth navigation transition for links
        document.querySelectorAll(".nav-link").forEach((link) => {
            link.addEventListener("click", function (e) {
                e.preventDefault();
                const targetUrl = this.getAttribute("href");
                closeMenu();
                document.body.style.opacity = "0";
                document.body.style.transform = "scale(1.05)";
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 600);
            });
        });

        // Enter Journey button
        document.getElementById("enterBtn").addEventListener("click", function (e) {
            e.preventDefault();
            document.body.style.opacity = "0";
            document.body.style.transform = "scale(1.05)";
            setTimeout(() => {
                window.location.href = "portfolio.html";
            }, 700);
        });
    </script>

</body>

</html>
